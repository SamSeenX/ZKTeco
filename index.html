<!DOCTYPE html>
<html lang="en">
<head>
    <!-- Google tag (gtag.js) -->
    <script async src="https://www.googletagmanager.com/gtag/js?id=G-281HSLMWRD"></script>
    <script>
      window.dataLayer = window.dataLayer || [];
      function gtag(){dataLayer.push(arguments);}
      gtag('js', new Date());

      gtag('config', 'G-281HSLMWRD');
    </script>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ZKTeco Attendance Visualizer</title>
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
</head>
<body>

<div class="container">
    <button id="themeToggle" class="btn theme-toggle" title="Toggle Dark Mode">🌙</button>
    <div class="top-section">
        <div class="header-container">
            <header class="header">
                <div class="header-content">
                    <h1>ZKTeco Attendance Visualizer</h1>
                    <p class="subtitle">Better visualization for ZKTeco fingerprint and face recognition attendance machine data.</p>
                </div>
            </header>
        </div>

        <div class="card upload-card">
            <div class="upload-section" id="dropZone">
                <div class="drop-zone-content">
                    <div class="drop-zone-icon">✨</div>
                    <div class="drop-zone-text">Drop your ZKTeco report here</div>
                    <button class="btn btn-export" style="margin-top: 10px; background: var(--primary); padding: 8px 16px; font-size: 0.85rem;">Browse Files</button>
                    <input type="file" id="csvFileInput" accept=".csv" style="display: none;" />
                </div>
                <span id="uploadStatus" style="color: var(--text-muted); font-size: 0.75rem; margin-top: 10px; font-weight: 500;">No file loaded yet</span>
            </div>
        </div>
    </div>

        <div class="controls-section" id="controlsSection">
            <div class="form-group">
                <label for="userFilter">Filter by User</label>
                <select id="userFilter">
                    <option value="ALL">All Users</option>
                </select>
            </div>
            <div class="form-group">
                <label for="dateFilter">Filter by Date</label>
                <select id="dateFilter">
                    <option value="ALL">All Dates</option>
                </select>
            </div>
            
            <div class="export-group">
                <button id="exportBtn" class="btn btn-export">Download Excel (CSV)</button>
                <button id="pdfBtn" class="btn btn-pdf">Save as PDF</button>
            </div>
        </div>
    </div>

    <div class="card" id="dataTable">
        <div class="table-container">
            <table id="attendanceTable">
                <thead id="tableHead">
                    <!-- Headers will be injected here via JavaScript -->
                </thead>
                <tbody id="tableBody">
                    <!-- Rows will be injected here via JavaScript -->
                </tbody>
            </table>
        </div>
    </div>
</div>

<footer>
    <p>made with ❤️ by <a href="https://samseen.dev" target="_blank" rel="noopener noreferrer">SamSeen</a> | <a href="https://www.buymeacoffee.com/samseen" target="_blank" rel="noopener noreferrer">☕ Buy Me a Coffee</a></p>
</footer>

<script type="module" src="/src/js/main.js"></script>
</body>
</html>
